name: WAR ITALY Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate game JavaScript and interface IDs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw new Error('Script di gioco non trovato');
          fs.writeFileSync('/tmp/war-italy.js', script[1]);
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          const refs = [...script[1].matchAll(/\$\(["']([^"']+)["']\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !ids.includes(id)))];
          if (duplicates.length) throw new Error('ID HTML duplicati: ' + [...new Set(duplicates)].join(', '));
          if (missing.length) throw new Error('Riferimenti DOM senza elemento: ' + missing.join(', '));
          console.log('Controllo interfaccia superato: ' + ids.length + ' ID e ' + new Set(refs).size + ' riferimenti DOM.');
          NODE
          node --check /tmp/war-italy.js

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAR-ITALY-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
